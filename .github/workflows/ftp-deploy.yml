name: Deploy to Production (FTP/SFTP)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-prod-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build static export (production)
        run: npx next build
        env:
          NEXT_PUBLIC_STATIC: "prod"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Accept SFTP host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "$FTP_PORT" "$FTP_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}

      - name: Deploy via SFTP (lftp mirror)
        run: |
          # Step 1 — upload _next/ assets (hashed JS/CSS) FIRST
          lftp -u "$FTP_USER","$FTP_PASSWORD" sftp://"$FTP_HOST":"$FTP_PORT" \
            -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror --reverse --verbose ./out/_next/ public_html/_next/; bye"
          # Step 2 — upload HTML pages and public assets (now CSS already exists)
          lftp -u "$FTP_USER","$FTP_PASSWORD" sftp://"$FTP_HOST":"$FTP_PORT" \
            -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror --reverse --verbose --exclude _next ./out/ public_html/; bye"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
